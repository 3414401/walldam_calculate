# render.com 배포 설정 (Blueprint)
# render.com 대시보드에서 이 저장소를 연결하면 아래 설정으로 웹 서비스가 만들어집니다.
services:
  - type: web
    name: walldam-indicators
    runtime: python
    plan: free
    # 배포할 때마다 지표를 다시 계산(build)한 뒤 서버를 실행합니다.
    buildCommand: "pip install -r requirements.txt && python build_indicators.py"
    startCommand: "gunicorn app.main:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
