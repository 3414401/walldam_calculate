<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>지역별 지표 대시보드</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #263449;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
      --ok: #4ade80;
      --err: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 24px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 16px;
      flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 20px; }
    header .meta { color: var(--muted); font-size: 13px; }
    .layout { display: flex; min-height: calc(100vh - 74px); }
    aside {
      width: 280px;
      border-right: 1px solid var(--border);
      padding: 16px;
      overflow-y: auto;
      max-height: calc(100vh - 74px);
    }
    aside input {
      width: 100%;
      padding: 9px 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
    }
    .region-group { margin-bottom: 8px; }
    .region-group > .sido {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      padding: 8px 4px 4px;
    }
    .region-item {
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .region-item:hover { background: var(--panel); }
    .region-item.active { background: var(--accent); color: #04212f; font-weight: 600; }
    main { flex: 1; padding: 28px; overflow-y: auto; max-height: calc(100vh - 74px); }
    .title { font-size: 22px; margin: 0 0 4px; }
    .subtitle { color: var(--muted); margin: 0 0 20px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
    }
    .card .fname { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .card .value { font-size: 30px; font-weight: 700; }
    .card .value.err { font-size: 15px; font-weight: 500; color: var(--err); }
    .card .unit { font-size: 14px; color: var(--muted); margin-left: 6px; }
    .card .desc { margin-top: 10px; font-size: 12px; color: var(--muted); }
    .card .detail { margin-top: 10px; font-size: 12px; color: var(--muted); }
    .card .detail span { display: inline-block; background: var(--panel-2); padding: 2px 8px; border-radius: 6px; margin: 2px 4px 0 0; }
    .empty { color: var(--muted); padding: 40px 0; }
    .banner { background: #422006; color: #fed7aa; padding: 12px 16px; border-radius: 10px; margin-bottom: 18px; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>📊 지역별 지표 대시보드</h1>
    <span class="meta" id="meta"></span>
  </header>
  <div class="layout">
    <aside>
      <input id="search" type="text" placeholder="지역 검색 (예: 유성구)" />
      <div id="region-list"></div>
    </aside>
    <main>
      <div id="content"><p class="empty">데이터를 불러오는 중…</p></div>
    </main>
  </div>

  <script>
    let DATA = null;
    let activeKey = null;

    const key = (r) => `${r.sido}/${r.gu}`;

    async function load() {
      const res = await fetch("/api/indicators");
      DATA = await res.json();
      renderMeta();
      renderRegions();
      if (DATA.regions.length) select(key(DATA.regions[0]));
      else document.getElementById("content").innerHTML =
        `<div class="banner">${DATA.error || "표시할 지표가 없습니다. data/ 에 엑셀을 넣고 build_indicators.py 를 실행하세요."}</div>`;
    }

    function renderMeta() {
      const s = DATA.summary || {};
      const gen = DATA.generated_at ? new Date(DATA.generated_at).toLocaleString("ko-KR") : "-";
      document.getElementById("meta").textContent =
        `지역 ${DATA.regions.length}곳 · 지표 ${s.total || 0}개 (성공 ${s.ok || 0} / 실패 ${s.failed || 0}) · 갱신 ${gen}`;
    }

    function renderRegions(filter = "") {
      const container = document.getElementById("region-list");
      const groups = {};
      DATA.regions
        .filter((r) => (r.sido + r.gu).toLowerCase().includes(filter.toLowerCase()))
        .forEach((r) => { (groups[r.sido] = groups[r.sido] || []).push(r); });

      container.innerHTML = "";
      Object.keys(groups).sort().forEach((sido) => {
        const g = document.createElement("div");
        g.className = "region-group";
        g.innerHTML = `<div class="sido">${sido}</div>`;
        groups[sido].forEach((r) => {
          const item = document.createElement("div");
          item.className = "region-item" + (key(r) === activeKey ? " active" : "");
          item.textContent = r.gu;
          item.onclick = () => select(key(r));
          g.appendChild(item);
        });
        container.appendChild(g);
      });
    }

    function select(k) {
      activeKey = k;
      renderRegions(document.getElementById("search").value);
      const region = DATA.regions.find((r) => key(r) === k);
      if (!region) return;

      const cards = region.indicators.map((ind) => {
        const hasErr = ind.error || ind.value === null;
        const valueHtml = hasErr
          ? `<div class="value err">⚠ ${ind.error || "값 없음"}</div>`
          : `<div class="value">${formatNum(ind.value)}<span class="unit">${ind.unit || ""}</span></div>`;
        const detail = ind.detail && Object.keys(ind.detail).length
          ? `<div class="detail">${Object.entries(ind.detail).map(([k, v]) => `<span>${k}: ${v}</span>`).join("")}</div>`
          : "";
        return `<div class="card">
            <div class="fname">${ind.name || ("공식" + ind.formula_id)} · <code>${ind.source_file || ""}</code></div>
            ${valueHtml}
            ${detail}
          </div>`;
      }).join("");

      document.getElementById("content").innerHTML = `
        <h2 class="title">${region.sido} ${region.gu}</h2>
        <p class="subtitle">공식 ${region.indicators.length}개 계산 결과</p>
        <div class="cards">${cards || '<p class="empty">이 지역에 지표가 없습니다.</p>'}</div>`;
    }

    function formatNum(v) {
      if (v === null || v === undefined) return "-";
      return Number(v).toLocaleString("ko-KR", { maximumFractionDigits: 4 });
    }

    document.getElementById("search").addEventListener("input", (e) => renderRegions(e.target.value));
    load();
  </script>
</body>
</html>
